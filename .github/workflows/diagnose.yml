name: Diagnose selectors

# Manual only. Prints a structural summary of a chain's live pages to the log so
# selectors can be written from real markup rather than guessed. Writes nothing.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dom = rendered page structure, api = ordering endpoints'
        type: choice
        options: [dom, api]
        default: dom
      chain:
        description: 'Chain to diagnose (dom mode only)'
        type: choice
        options: [dominos]
        default: dominos

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Diagnose rendered DOM
        if: inputs.mode == 'dom'
        run: npx tsx scrapers/diagnose.ts ${{ inputs.chain }}

      - name: Diagnose ordering endpoints
        if: inputs.mode == 'api'
        run: npx tsx scrapers/diagnose-api.ts
