name: Deploy to GitHub Pages

# Data is baked into the build, so "deploy" and "refresh the deals" are the same action.
# The daily schedule is what keeps the site current; pushes deploy code changes.
on:
  push:
    branches: [main]
  schedule:
    # 09:00 UTC daily — early morning US, after chains have posted any new offers.
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let a scheduled rebuild race a push deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Build static site
        # basePath must match the repository name for a project Pages site. Drop this
        # env var if the site moves to a custom domain served from the root.
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      # Pages is served by Jekyll unless told otherwise, and Jekyll ignores any directory
      # starting with an underscore — which would silently drop all of Next's _next/
      # assets and leave an unstyled, non-interactive page.
      - name: Disable Jekyll
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
